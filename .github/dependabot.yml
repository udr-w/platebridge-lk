version: 2

updates:
  # React, TypeScript, Vite, Playwright and other frontend packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # FastAPI, SQLAlchemy, Pydantic, pytest and other Python packages
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base images used by the frontend and backend Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep workflow actions updated when GitHub Actions workflows are added
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:45"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    groups:
      github-actions-updates:
        patterns:
          - "*"
